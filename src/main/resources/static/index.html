
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeQuest | Java Quiz</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
        }

        header {
            background: #1e293b;
            padding: 20px;
        }

        h1 { color: #38bdf8; }

        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
        }

        .code {
            background: #1e293b;
            padding: 18px;
            border-radius: 8px;
            text-align: left;
            white-space: pre-wrap;
        }

        .answers {
            display: grid;
            gap: 12px;
            margin-top: 20px;
        }

        button, select {
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }

        select {
            background: white;
            color: #0f172a;
        }

        button {
            background: #38bdf8;
            color: #0f172a;
        }

        .answer {
            background: #334155;
            color: white;
        }

        .answer:hover:not(:disabled) {
            background: #475569;
        }

        button:disabled { cursor: default; }

        .correct { background: #15803d !important; }
        .wrong { background: #b91c1c !important; }

        #feedback {
            min-height: 24px;
        }

        .error {
            color: #fca5a5;
        }
    </style>
</head>

<body>
    <header>
        <h1>CodeQuest</h1>
        <p>Your Coding Practice Arena</p>
    </header>

    <main class="container" id="quiz">
        <div id="levelSelector">
            <label for="level">Choose Level:</label>
            <select id="level">
                <option value="1">Level 1</option>
                <option value="2">Level 2</option>
                <option value="3">Level 3</option>
                <option value="4">Level 4</option>
                <option value="5">Level 5</option>
                <option value="6">Level 6</option>
                <option value="7">Level 7</option>
                <option value="8">Level 8</option>
                <option value="9">Level 9</option>
                <option value="10">Level 10</option>
            </select>
            <button id="startLevel">Start Level</button>
        </div>

        <p id="progress">Choose a level to begin!</p>
        <h2 id="question"></h2>
        <pre class="code" id="code"></pre>
        <div class="answers" id="answers"></div>
        <p id="feedback"></p>
        <p id="score">Score: 0</p>
        <button id="next" hidden>Next Question</button>
    </main>

    <script>
        let questions = [];
        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        async function loadQuestions() {
            const level = document.getElementById("level").value;
            const progress = document.getElementById("progress");

            progress.textContent = "Loading questions...";
            document.getElementById("question").textContent = "";
            document.getElementById("code").textContent = "";
            document.getElementById("answers").innerHTML = "";
            document.getElementById("feedback").textContent = "";
            document.getElementById("next").hidden = true;

            try {
                const response = await fetch("/api/quiz/level/" + level);

                if (!response.ok) {
                    throw new Error("Server returned status " + response.status);
                }

                const data = await response.json();

                if (!Array.isArray(data) || data.length === 0) {
                    progress.textContent =
                        "No questions available for Level " + level + " yet.";
                    document.getElementById("score").textContent = "Score: 0";
                    return;
                }

                questions = data;
                currentQuestion = 0;
                score = 0;
                answered = false;

                showQuestion();
            } catch (error) {
                console.error("Could not load quiz:", error);
                progress.textContent =
                    "Couldn't load the quiz. Make sure the Java backend is running.";
            }
        }

        function showQuestion() {
            answered = false;

            const q = questions[currentQuestion];

            document.getElementById("progress").textContent =
                `Question ${currentQuestion + 1} of ${questions.length}`;

            document.getElementById("question").textContent = q.question;
            document.getElementById("code").textContent = q.code || "";
            document.getElementById("feedback").textContent = "";
            document.getElementById("score").textContent = `Score: ${score}`;
            document.getElementById("next").hidden = true;

            const answers = document.getElementById("answers");
            answers.innerHTML = "";

            q.options.forEach((option, index) => {
                const button = document.createElement("button");
                button.textContent = option;
                button.className = "answer";
                button.onclick = () => checkAnswer(index, button);
                answers.appendChild(button);
            });
        }

        function checkAnswer(selected, button) {
            if (answered) return;

            answered = true;

            const q = questions[currentQuestion];
            const buttons = document.querySelectorAll(".answer");

            buttons.forEach((b, index) => {
                b.disabled = true;

                if (index === Number(q.answer)) {
                    b.classList.add("correct");
                }
            });

            if (selected === Number(q.answer)) {
                score++;
                document.getElementById("feedback").textContent =
                    "Correct! " + (q.explanation || "");
            } else {
                button.classList.add("wrong");
                document.getElementById("feedback").textContent =
                    "Not quite. " + (q.explanation || "");
            }

            document.getElementById("score").textContent = `Score: ${score}`;
            document.getElementById("next").hidden = false;
        }

        function nextQuestion() {
            currentQuestion++;

            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                document.getElementById("progress").textContent = "Quest complete!";
                document.getElementById("question").textContent =
                    `You scored ${score} out of ${questions.length}!`;
                document.getElementById("code").textContent = "";
                document.getElementById("answers").innerHTML = "";
                document.getElementById("feedback").textContent =
                    "Great job! Choose a level above to play again.";
                document.getElementById("next").hidden = true;
            }
        }

        document.getElementById("startLevel").onclick = loadQuestions;
        document.getElementById("next").onclick = nextQuestion;

        loadQuestions();
    </script>
</body>
</html>
